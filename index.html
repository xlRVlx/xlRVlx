<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #202020 0%, #111 45%, #080808 100%);
      color: #fff;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 45px;
    }

    header h1 {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    header p {
      margin-top: 8px;
      color: #aaa;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .section {
      margin-bottom: 45px;
    }

    .section-title {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 20px;
      color: #fff;
    }

    /* =========================
       FEATURED SONG
    ========================= */

    .featured-card {
      max-width: 850px;
      margin: auto;
      background: #1b1b1b;
      border: 1px solid #303030;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    .player-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    .player-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .song-info {
      text-align: center;
      margin-top: 18px;
    }

    .song-info h2 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    .song-info p {
      color: #999;
      font-size: 14px;
    }

    .update-status {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 10px;
    }

    .player-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .control-btn,
    .youtube-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border: 1px solid #3b3b3b;
      background: #242424;
      color: #fff;
      padding: 11px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .control-btn:hover,
    .youtube-btn:hover {
      transform: translateY(-2px);
      background: #303030;
      border-color: #666;
    }

    .control-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    .youtube-btn {
      margin-top: 14px;
      background: #181818;
    }

    /* =========================
       LINK GRID
    ========================= */

    .link-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      max-width: 900px;
      margin: auto;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      padding: 15px;
      background: #1b1b1b;
      border: 1px solid #303030;
      border-radius: 14px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      transition: 0.25s ease;
      text-align: center;
    }

    .link-card:hover {
      transform: translateY(-5px);
      background: #242424;
      border-color: #555;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .link-card.disabled {
      opacity: 0.45;
      cursor: default;
      pointer-events: none;
    }

    .link-card svg {
      width: 22px;
      height: 22px;
      margin-right: 10px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      text-align: center;
      margin-top: 55px;
      color: #666;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 800px) {
      .link-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      header h1 {
        font-size: 42px;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 30px 15px;
      }

      header h1 {
        font-size: 36px;
      }

      .link-grid {
        grid-template-columns: 1fr;
      }

      .control-btn,
      .youtube-btn {
        width: 100%;
      }

      .player-controls {
        flex-direction: column;
      }
    }
  </style>

  <!-- =========================
       YOUTUBE AUTO PLAYER
  ========================== -->

  <script>

    const CHANNEL_ID =
      "UCT2xwca6wWHTygBPorpxujQ";

    /*
      Backup song.
      This will be used if the automatic
      YouTube feed cannot be loaded.
    */
    const FALLBACK_VIDEO_ID =
      "VJncR7t_OT4";


    /*
      YouTube RSS feed
    */
    const RSS_URL =
      "https://www.youtube.com/feeds/videos.xml?channel_id=" +
      CHANNEL_ID;


    /*
      RSS2JSON converts the YouTube RSS
      feed so the browser can read it.
    */
    const API_URL =
      "https://api.rss2json.com/v1/api.json?rss_url=" +
      encodeURIComponent(RSS_URL);


    /*
      Song list
    */
    let songs = [];

    /*
      0 = latest upload
      Higher numbers = older uploads
    */
    let currentSongIndex = 0;


    /*
      HTML elements
    */
    const player =
      document.getElementById("youtubePlayer");

    const songTitle =
      document.getElementById("songTitle");

    const youtubeButton =
      document.getElementById("youtubeButton");

    const status =
      document.getElementById("updateStatus");

    const previousBtn =
      document.getElementById("previousBtn");

    const nextBtn =
      document.getElementById("nextBtn");


    /*
      LOAD YOUTUBE UPLOADS
    */
    async function loadLatestYouTubeUploads() {

      try {

        const response =
          await fetch(API_URL);


        if (!response.ok) {
          throw new Error(
            "Feed request failed"
          );
        }


        const data =
          await response.json();


        if (
          data.status !== "ok" ||
          !data.items ||
          data.items.length === 0
        ) {

          throw new Error(
            "No uploads found"
          );

        }


        /*
          Convert the RSS results
          into our song list.
        */
        songs = data.items

          .map(item => {

            let videoId = null;


            /*
              Try GUID
            */
            if (item.guid) {

              const match =
                item.guid.match(
                  /video:([a-zA-Z0-9_-]+)/
                );


              if (match) {
                videoId = match[1];
              }

            }


            /*
              Try normal YouTube URL
            */
            if (
              !videoId &&
              item.link
            ) {

              const match =
                item.link.match(
                  /[?&]v=([a-zA-Z0-9_-]+)/
                );


              if (match) {
                videoId = match[1];
              }

            }


            return {

              id: videoId,

              title:
                item.title ||
                "xlRVlx — Official Music",

              link:
                item.link ||
                `https://www.youtube.com/watch?v=${videoId}`

            };

          })


          /*
            Remove invalid entries.
          */
          .filter(
            song => song.id
          );


        if (
          songs.length === 0
        ) {

          throw new Error(
            "No valid videos found"
          );

        }


        /*
          The first result is the
          latest upload.
        */
        currentSongIndex = 0;


        /*
          Show latest song.
        */
        displaySong(
          currentSongIndex,
          false
        );


        status.textContent =
          "Latest from xlRVlx";


        updateButtons();

      }

      catch (error) {

        console.error(
          "Unable to load YouTube uploads:",
          error
        );


        /*
          Backup song.
        */
        songs = [

          {
            id:
              FALLBACK_VIDEO_ID,

            title:
              "xlRVlx — Official Music",

            link:
              `https://www.youtube.com/watch?v=${FALLBACK_VIDEO_ID}`
          }

        ];


        currentSongIndex = 0;


        displaySong(
          currentSongIndex,
          false
        );


        status.textContent =
          "Featured song from xlRVlx";


        updateButtons();

      }

    }


    /*
      DISPLAY SONG

      autoplay = true
      means the song should begin
      playing when NEXT/PREVIOUS
      is clicked.
    */
    function displaySong(
      index,
      autoplay = false
    ) {

      if (
        !songs.length ||
        !songs[index]
      ) {

        return;

      }


      const song =
        songs[index];


      /*
        Build YouTube player URL.

        autoplay=1 is added when
        the visitor clicks NEXT
        or PREVIOUS.
      */
      let playerURL =
        `https://www.youtube.com/embed/${song.id}`;


      if (autoplay) {

        playerURL +=
          "?autoplay=1";

      }


      /*
        Change the video.
      */
      player.src =
        playerURL;


      /*
        Change title.
      */
      songTitle.textContent =
        song.title;


      /*
        Change YouTube button.
      */
      youtubeButton.href =
        song.link;


      /*
        Update button states.
      */
      updateButtons();

    }


    /*
      NEXT SONG

      Latest → Older
    */
    function showNextSong() {

      if (
        currentSongIndex <
        songs.length - 1
      ) {

        currentSongIndex++;


        displaySong(
          currentSongIndex,
          true
        );

      }

    }


    /*
      PREVIOUS SONG

      Older → Newer
    */
    function showPreviousSong() {

      if (
        currentSongIndex > 0
      ) {

        currentSongIndex--;


        displaySong(
          currentSongIndex,
          true
        );

      }

    }


    /*
      BUTTON STATES
    */
    function updateButtons() {

      /*
        Disable PREVIOUS
        when already at newest song.
      */
      previousBtn.disabled =
        currentSongIndex <= 0;


      /*
        Disable NEXT
        when already at oldest song
        available in the feed.
      */
      nextBtn.disabled =
        currentSongIndex >=
        songs.length - 1;

    }


    /*
      START
    */
    loadLatestYouTubeUploads();

  </script>
