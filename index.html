<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>xlRVlx</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #242424 0%, #111 45%, #080808 100%);
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
        }

        /* HEADER */

        header {
            text-align: center;
            margin-bottom: 45px;
        }

        header h1 {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 3px;
        }

        header p {
            margin-top: 8px;
            color: #aaa;
            font-size: 15px;
            letter-spacing: 1px;
        }

        /* SECTION */

        section {
            margin-bottom: 50px;
        }

        .section-title {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 22px;
        }

        /* SQUARE CARDS */

        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 18px;
            justify-items: center;
        }

        .social-card {
            width: 150px;
            height: 150px;

            background: linear-gradient(
                145deg,
                #202020,
                #121212
            );

            border: 1px solid #303030;
            border-radius: 18px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
            padding: 15px;

            text-decoration: none;
            color: #fff;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .social-card:hover {
            transform: translateY(-7px);
            border-color: #555;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
        }

        .social-card svg {
            width: 42px;
            height: 42px;
            margin-bottom: 14px;
            fill: currentColor;
        }

        .social-card span {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* DISABLED CARD */

        .social-card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .social-card.disabled:hover {
            transform: none;
            box-shadow: none;
        }

        /* FEATURED SONG */

        .featured-card {
            max-width: 850px;
            margin: auto;

            background: linear-gradient(
                145deg,
                #1d1d1d,
                #101010
            );

            border: 1px solid #303030;
            border-radius: 20px;
            padding: 20px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .player-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
        }

        .player-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .song-info {
            text-align: center;
            margin-top: 18px;
        }

        .song-info h3 {
            font-size: 20px;
            margin-bottom: 7px;
        }

        .artist {
            color: #aaa;
            font-size: 14px;
        }

        .update-status {
            color: #777;
            font-size: 12px;
            margin-top: 8px;
        }

        /* PLAYER CONTROLS */

        .player-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .player-btn {
            border: 1px solid #3a3a3a;
            background: #1b1b1b;
            color: #fff;

            padding: 11px 18px;
            border-radius: 10px;

            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                border-color 0.2s ease;
        }

        .player-btn:hover {
            background: #292929;
            border-color: #555;
            transform: translateY(-2px);
        }

        .player-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .youtube-btn {
            display: inline-block;
            margin-top: 14px;

            background: #fff;
            color: #111;

            text-decoration: none;

            padding: 10px 18px;
            border-radius: 9px;

            font-size: 12px;
            font-weight: 700;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .youtube-btn:hover {
            transform: translateY(-2px);
            opacity: 0.85;
        }

        /* FOOTER */

        footer {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #222;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            body {
                padding: 30px 15px;
            }

            header h1 {
                font-size: 38px;
            }

            .social-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .social-card {
                width: 130px;
                height: 130px;
            }

            .social-card svg {
                width: 36px;
                height: 36px;
            }

            .social-card span {
                font-size: 13px;
            }

            .featured-card {
                padding: 12px;
            }
        }
    </style>
</head>

<script>

    const CHANNEL_ID =
        "UCT2xwca6wWHTygBPorpxujQ";

    const FALLBACK_VIDEO_ID =
        "VJncR7t_OT4";

    const RSS_URL =
        "https://www.youtube.com/feeds/videos.xml?channel_id=" +
        CHANNEL_ID;

    const API_URL =
        "https://api.rss2json.com/v1/api.json?rss_url=" +
        encodeURIComponent(RSS_URL);


    const player =
        document.getElementById("youtubePlayer");

    const songTitle =
        document.getElementById("songTitle");

    const youtubeButton =
        document.getElementById("youtubeButton");

    const status =
        document.getElementById("updateStatus");

    const previousBtn =
        document.getElementById("previousBtn");

    const nextBtn =
        document.getElementById("nextBtn");


    let songs = [];

    let currentSongIndex = 0;


    function updateButtons() {

        previousBtn.disabled =
            currentSongIndex === 0;

        nextBtn.disabled =
            currentSongIndex >= songs.length - 1;

    }


    function displaySong(index, autoplay = false) {

        if (!songs.length || !songs[index]) {
            return;
        }

        const song = songs[index];

        let playerURL =
            `https://www.youtube.com/embed/${song.id}`;

        /*
         * Autoplay is only added when the user
         * presses Previous or Next.
         */

        if (autoplay) {
            playerURL += "?autoplay=1";
        }

        player.src = playerURL;

        songTitle.textContent =
            song.title;

        youtubeButton.href =
            song.link;

        updateButtons();

    }


    function showNextSong() {

        if (
            currentSongIndex <
            songs.length - 1
        ) {

            currentSongIndex++;

            displaySong(
                currentSongIndex,
                true
            );

        }

    }


    function showPreviousSong() {

        if (currentSongIndex > 0) {

            currentSongIndex--;

            displaySong(
                currentSongIndex,
                true
            );

        }

    }


    async function loadLatestYouTubeUpload() {

        try {

            const response =
                await fetch(API_URL);

            if (!response.ok) {
                throw new Error(
                    "Unable to fetch uploads"
                );
            }

            const data =
                await response.json();

            if (
                data.status !== "ok" ||
                !data.items ||
                !data.items.length
            ) {

                throw new Error(
                    "No uploads found"
                );

            }


            songs = data.items
                .map(item => {

                    let videoId = "";

                    /*
                     * RSS2JSON normally gives the
                     * YouTube video ID in guid.
                     */

                    const guid =
                        item.guid || "";

                    const guidMatch =
                        guid.match(
                            /video:([a-zA-Z0-9_-]+)/
                        );

                    if (guidMatch) {
                        videoId =
                            guidMatch[1];
                    }


                    /*
                     * Fallback:
                     * extract ?v= from the link.
                     */

                    if (!videoId && item.link) {

                        const linkMatch =
                            item.link.match(
                                /[?&]v=([a-zA-Z0-9_-]+)/
                            );

                        if (linkMatch) {
                            videoId =
                                linkMatch[1];
                        }

                    }


                    return {

                        id: videoId,

                        title:
                            item.title ||
                            "xlRVlx Song",

                        link:
                            item.link ||
                            `https://www.youtube.com/watch?v=${videoId}`

                    };

                })
                .filter(song => song.id);


            if (!songs.length) {
                throw new Error(
                    "Could not find video IDs"
                );
            }


            /*
             * YouTube RSS returns newest first.
             *
             * Index 0 = latest
             * Index 1 = older
             * Index 2 = even older
             */

            currentSongIndex = 0;

            displaySong(
                currentSongIndex,
                false
            );


            status.textContent =
                "Latest from xlRVlx";


        } catch (error) {

            console.log(
                "YouTube RSS error:",
                error
            );


            /*
             * Keep the fallback song
             * if automatic loading fails.
             */

            songs = [

                {
                    id: FALLBACK_VIDEO_ID,

                    title:
                        "Latest from xlRVlx",

                    link:
                        `https://www.youtube.com/watch?v=${FALLBACK_VIDEO_ID}`
                }

            ];


            currentSongIndex = 0;


            displaySong(
                currentSongIndex,
                false
            );


            status.textContent =
                "Featured song from xlRVlx";

        }

    }


    /*
     * Load the latest YouTube upload
     * when the page opens.
     */

    loadLatestYouTubeUpload();

</script>
